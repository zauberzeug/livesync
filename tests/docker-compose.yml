version: "3.9"
services:
  livesync:
    build:
      context: ../
      args:
        VERSION: 0.0.0  # the package version is irrelevant for these tests
    volumes:
      - ./target:/target
      - ./.ssh/id_ed25519:/root/.ssh/id_ed25519:ro  # generated by run.sh

  target:
    build:
      context: ./
    volumes:
      - ./target:/root
