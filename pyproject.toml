[project]
name = "livesync"
dynamic = ["version"]
description = "Repeatedly synchronize local workspace with a (slow) remote machine"
authors = [{ name = "Zauberzeug GmbH", email = "info@zauberzeug.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["sync", "remote", "watch", "filesystem", "development", "deploy", "live", "hot", "reload"]
dependencies = [
    "pathspec>=1.1.0",  # GitIgnoreSpecPattern discards invalid range patterns like Git since 1.1.0
    "watchfiles",
]

[project.urls]
Repository = "https://github.com/zauberzeug/livesync"

[project.scripts]
livesync = "livesync.livesync:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "autopep8>=2.0.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.1",
]

[build-system]
requires = [
    "poetry-core>=2.0.0",
    "poetry-dynamic-versioning>=1.0.0",
]
build-backend = "poetry_dynamic_versioning.backend"

[tool.uv]
# one uv line for CI (setup-uv reads it), the Dockerfile and the pre-commit hook;
# uv refuses to run with another version, so the three cannot drift apart unnoticed
required-version = "~=0.13.9"

[tool.poetry]
packages = [{ include = "livesync" }]
version = "0.0.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"

[tool.autopep8]
max-line-length = 120
experimental = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# see https://docs.astral.sh/ruff/rules/
select = [
    "I",  # isort
    "E",  # pycodestyle
    "W",  # pycodestyle
    "B",  # bugbear
    "F",  # pyflakes
    "UP",  # pyupgrade
    "RUF",  # ruff
    "PL",  # pylint
    "Q",  # flake8-quotes
    "ASYNC",  # flake8-async
    "C4",  # flake8-comprehensions
    "FURB",  # refurb
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PERF",  # perflint
    "PIE",  # flake8-pie
    "RSE",  # flake8-raise
    "BLE",  # flake8-blind-except
    "SLF",  # flake8-self
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "SIM105",  # use contextlib.suppress
    "FIX001",  # FIXME comments
    "FIX002",  # TODO comments
]
ignore = [
    "E501",  # line too long (autopep8 wraps at 120)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]  # tests inspect private members on purpose

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "double"
avoid-escape = true

[tool.codespell]
skip = "*.lock"
check-hidden = true
